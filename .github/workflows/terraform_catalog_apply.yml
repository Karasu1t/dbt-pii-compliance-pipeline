name: Terraform Catalog Apply (Bootstrap)

# Manual only — catalog creation is infrequent bootstrap infrastructure,
# not something every PR should re-evaluate. Run this once per environment;
# ci.yml's dbt_build/terraform_apply/governance_check chain assumes the
# catalog this creates already exists.
on:
  workflow_dispatch:

jobs:
  catalog-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Set up dbt profile
        run: cp dbt/profiles.yml.example dbt/profiles.yml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/env/catalog
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/env/catalog
        run: terraform apply -auto-approve
        env:
          TF_VAR_project_root: ${{ github.workspace }}
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
