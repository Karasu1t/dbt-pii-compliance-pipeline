    description: Synthetic customer data (Faker-generated, no real PII). See scripts/generate_sample_data.py.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: raw_orders
    description: Synthetic order data (Faker-generated, no real PII). See scripts/generate_sample_data.py.
